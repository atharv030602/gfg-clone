# Netlify Configuration for GeeksforGeeks Clone
[build]
  # Build command (none needed for static site)
  command = ""
  # Publish directory
  publish = "."

# SPA (Single Page Application) redirects for better navigation
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/community/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/playground/*"
  to = "/code-playground.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache control
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment variables (you can set these in Netlify dashboard)
[build.environment]
  NODE_VERSION = "18"

# Form handling for contact forms
[build.processing]
  skip_processing = false

# Enable Netlify Forms
[build.processing.html]
  pretty_urls = true

# Performance optimizations
[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true