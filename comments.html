<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Demo - GeeksforGeeks Clone</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Comment System Styles */
        .comments-section {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid var(--border-color);
        }
        
        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .comments-count {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .sort-comments {
            display: flex;
            gap: 10px;
        }
        
        .sort-btn-comment {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        
        .sort-btn-comment.active {
            background: var(--text-accent);
            color: white;
            border-color: var(--text-accent);
        }
        
        .comment-form {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
        }
        
        .comment-textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
        }
        
        .comment-textarea:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 0 3px rgba(47, 141, 70, 0.1);
        }
        
        .comment-form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        
        .comment-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .submit-comment-btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-comment-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(47, 141, 70, 0.3);
        }
        
        .comment {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--text-accent);
            transition: all 0.3s ease;
        }
        
        .comment:hover {
            box-shadow: 0 4px 15px var(--shadow-light);
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .comment-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }
        
        .author-details h4 {
            color: var(--text-primary);
            font-size: 1.1rem;
            margin-bottom: 2px;
        }
        
        .comment-time {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .comment-actions {
            display: flex;
            gap: 15px;
        }
        
        .comment-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .comment-action:hover {
            color: var(--text-accent);
        }
        
        .comment-action.liked {
            color: #e74c3c;
        }
        
        .comment-content {
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .comment-footer {
            display: flex;
            justify-content: between;
            align-items: center;
        }
        
        .reply-form {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            display: none;
        }
        
        .reply-form.active {
            display: block;
        }
        
        .reply-textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
        }
        
        .reply-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .reply-btn, .cancel-reply-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .reply-btn {
            background: var(--text-accent);
            color: white;
        }
        
        .cancel-reply-btn {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        
        .replies {
            margin-left: 30px;
            margin-top: 20px;
            border-left: 2px solid var(--border-color);
            padding-left: 20px;
        }
        
        .reply {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid var(--text-accent);
        }
        
        @media (max-width: 768px) {
            .comments-section {
                padding: 20px 15px;
            }
            
            .comment-form-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .replies {
                margin-left: 15px;
                padding-left: 15px;
            }
            
            .comment-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>💻 GeeksforGeeks</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="comments.html" class="active">Comments Demo</a></li>
            </ul>
            <div class="nav-controls">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="article-content">
                <h1>Sample Article: Introduction to Data Structures</h1>
                <p>This is a sample article to demonstrate the comment system. Data structures are fundamental concepts in computer science...</p>
            </div>

            <section class="comments-section">
                <div class="comments-header">
                    <h3 class="comments-count">💬 Comments (3)</h3>
                    <div class="sort-comments">
                        <button class="sort-btn-comment active" data-sort="newest">Newest</button>
                        <button class="sort-btn-comment" data-sort="oldest">Oldest</button>
                        <button class="sort-btn-comment" data-sort="popular">Popular</button>
                    </div>
                </div>

                <div class="comment-form">
                    <textarea class="comment-textarea" placeholder="Share your thoughts..."></textarea>
                    <div class="comment-form-actions">
                        <div class="comment-user-info">
                            <span>👤 Commenting as Guest</span>
                        </div>
                        <button class="submit-comment-btn" onclick="addComment()">Post Comment</button>
                    </div>
                </div>

                <div class="comments-list" id="commentsList">
                    <!-- Comments will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Sample comments data
        let comments = [
            {
                id: 1,
                author: 'Alice Johnson',
                avatar: 'AJ',
                content: 'Great explanation! This really helped me understand the basics of data structures.',
                time: '2 hours ago',
                likes: 12,
                liked: false,
                replies: [
                    {
                        id: 11,
                        author: 'Bob Smith',
                        avatar: 'BS',
                        content: 'I agree! The examples were particularly helpful.',
                        time: '1 hour ago',
                        likes: 3,
                        liked: false
                    }
                ]
            },
            {
                id: 2,
                author: 'Charlie Brown',
                avatar: 'CB',
                content: 'Could you add more examples about trees and graphs? That would be awesome!',
                time: '4 hours ago',
                likes: 8,
                liked: true,
                replies: []
            },
            {
                id: 3,
                author: 'Diana Wilson',
                avatar: 'DW',
                content: 'This is exactly what I needed for my computer science course. Thank you!',
                time: '6 hours ago',
                likes: 15,
                liked: false,
                replies: []
            }
        ];

        // Render comments
        function renderComments() {
            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML = '';

            comments.forEach(comment => {
                const commentEl = createCommentElement(comment);
                commentsList.appendChild(commentEl);
            });

            updateCommentsCount();
        }

        function createCommentElement(comment) {
            const commentDiv = document.createElement('div');
            commentDiv.className = 'comment';
            commentDiv.innerHTML = `
                <div class="comment-header">
                    <div class="comment-author">
                        <div class="author-avatar">${comment.avatar}</div>
                        <div class="author-details">
                            <h4>${comment.author}</h4>
                            <span class="comment-time">${comment.time}</span>
                        </div>
                    </div>
                    <div class="comment-actions">
                        <button class="comment-action ${comment.liked ? 'liked' : ''}" onclick="toggleLike(${comment.id})">
                            ❤️ ${comment.likes}
                        </button>
                        <button class="comment-action" onclick="showReplyForm(${comment.id})">
                            💬 Reply
                        </button>
                        <button class="comment-action">
                            ⚠️ Report
                        </button>
                    </div>
                </div>
                <div class="comment-content">${comment.content}</div>
                <div class="reply-form" id="replyForm${comment.id}">
                    <textarea class="reply-textarea" placeholder="Write a reply..."></textarea>
                    <div class="reply-actions">
                        <button class="reply-btn" onclick="addReply(${comment.id})">Reply</button>
                        <button class="cancel-reply-btn" onclick="hideReplyForm(${comment.id})">Cancel</button>
                    </div>
                </div>
                <div class="replies" id="replies${comment.id}">
                    ${comment.replies.map(reply => `
                        <div class="reply">
                            <div class="comment-header">
                                <div class="comment-author">
                                    <div class="author-avatar" style="width: 30px; height: 30px; font-size: 1rem;">${reply.avatar}</div>
                                    <div class="author-details">
                                        <h4 style="font-size: 1rem;">${reply.author}</h4>
                                        <span class="comment-time">${reply.time}</span>
                                    </div>
                                </div>
                                <div class="comment-actions">
                                    <button class="comment-action ${reply.liked ? 'liked' : ''}" onclick="toggleReplyLike(${comment.id}, ${reply.id})">
                                        ❤️ ${reply.likes}
                                    </button>
                                </div>
                            </div>
                            <div class="comment-content">${reply.content}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            return commentDiv;
        }

        function addComment() {
            const textarea = document.querySelector('.comment-textarea');
            const content = textarea.value.trim();

            if (!content) {
                alert('Please write something before posting!');
                return;
            }

            const newComment = {
                id: Date.now(),
                author: 'You',
                avatar: 'YU',
                content: content,
                time: 'Just now',
                likes: 0,
                liked: false,
                replies: []
            };

            comments.unshift(newComment);
            textarea.value = '';
            renderComments();

            // Show success animation
            showNotification('Comment posted successfully! 🎉');
        }

        function toggleLike(commentId) {
            const comment = comments.find(c => c.id === commentId);
            if (comment) {
                comment.liked = !comment.liked;
                comment.likes += comment.liked ? 1 : -1;
                renderComments();
            }
        }

        function toggleReplyLike(commentId, replyId) {
            const comment = comments.find(c => c.id === commentId);
            if (comment) {
                const reply = comment.replies.find(r => r.id === replyId);
                if (reply) {
                    reply.liked = !reply.liked;
                    reply.likes += reply.liked ? 1 : -1;
                    renderComments();
                }
            }
        }

        function showReplyForm(commentId) {
            const replyForm = document.getElementById(`replyForm${commentId}`);
            replyForm.classList.add('active');
            replyForm.querySelector('.reply-textarea').focus();
        }

        function hideReplyForm(commentId) {
            const replyForm = document.getElementById(`replyForm${commentId}`);
            replyForm.classList.remove('active');
            replyForm.querySelector('.reply-textarea').value = '';
        }

        function addReply(commentId) {
            const replyForm = document.getElementById(`replyForm${commentId}`);
            const textarea = replyForm.querySelector('.reply-textarea');
            const content = textarea.value.trim();

            if (!content) {
                alert('Please write a reply!');
                return;
            }

            const comment = comments.find(c => c.id === commentId);
            if (comment) {
                const newReply = {
                    id: Date.now(),
                    author: 'You',
                    avatar: 'YU',
                    content: content,
                    time: 'Just now',
                    likes: 0,
                    liked: false
                };

                comment.replies.push(newReply);
                hideReplyForm(commentId);
                renderComments();
                showNotification('Reply posted! 💬');
            }
        }

        function updateCommentsCount() {
            const totalComments = comments.reduce((total, comment) => total + 1 + comment.replies.length, 0);
            document.querySelector('.comments-count').textContent = `💬 Comments (${totalComments})`;
        }

        function sortComments(sortBy) {
            switch(sortBy) {
                case 'oldest':
                    comments.sort((a, b) => a.id - b.id);
                    break;
                case 'popular':
                    comments.sort((a, b) => b.likes - a.likes);
                    break;
                case 'newest':
                default:
                    comments.sort((a, b) => b.id - a.id);
                    break;
            }
            renderComments();
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--text-accent);
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 10000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);

            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderComments();

            // Sort buttons
            document.querySelectorAll('.sort-btn-comment').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.sort-btn-comment').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    sortComments(this.dataset.sort);
                });
            });
        });
    </script>
</body>
</html>
