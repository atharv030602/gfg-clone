<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Success - GFG Clone</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .oauth-success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2f8d46 0%, #45a359 100%);
        }
        
        .success-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #2f8d46;
            margin-bottom: 1rem;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2f8d46;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="oauth-success-container">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h2>Login Successful!</h2>
            <p>You have been successfully authenticated. Redirecting you to the dashboard...</p>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const accessToken = urlParams.get('accessToken');
            const refreshToken = urlParams.get('refreshToken');
            const error = urlParams.get('error');

            if (error) {
                document.querySelector('.success-icon').textContent = '✗';
                document.querySelector('.success-icon').style.color = '#e74c3c';
                document.querySelector('h2').textContent = 'Login Failed';
                document.querySelector('p').textContent = 'There was an error during authentication. Redirecting to login page...';
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
                return;
            }

            if (accessToken && refreshToken) {
                // Store tokens
                localStorage.setItem('accessToken', accessToken);
                localStorage.setItem('refreshToken', refreshToken);
                
                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 2000);
            } else {
                // No tokens received, redirect to login
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
