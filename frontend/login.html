<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeeksforGeeks Clone</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gradient-bg); padding: 20px; }
        .auth-card { background: var(--bg-secondary); border-radius: 16px; box-shadow: 0 20px 60px var(--shadow-medium); max-width: 420px; width: 100%; border: 1px solid var(--border-color); overflow: hidden; }
        .auth-header { background: var(--gradient-primary); padding: 30px; text-align: center; color: white; }
        .auth-title { font-size: 1.8rem; margin-bottom: 8px; }
        .auth-subtitle { opacity: 0.9; font-size: 0.9rem; }
        .auth-body { padding: 30px; }
        .auth-tabs { display: flex; margin-bottom: 24px; background: var(--bg-tertiary); border-radius: 8px; padding: 4px; }
        .auth-tab { flex: 1; background: none; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--text-secondary); transition: all 0.3s; }
        .auth-tab.active { background: var(--gradient-primary); color: white; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; margin-bottom: 6px; color: var(--text-primary); font-weight: 500; font-size: 0.9rem; }
        .form-input { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; transition: border-color 0.3s; box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: var(--text-accent); }
        .form-button { width: 100%; background: var(--gradient-primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-bottom: 16px; }
        .form-button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(47,141,70,0.3); }
        .form-button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-divider { text-align: center; margin: 20px 0; position: relative; color: var(--text-secondary); }
        .auth-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-color); }
        .auth-divider span { background: var(--bg-secondary); padding: 0 15px; position: relative; }
        .google-btn { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; }
        .google-btn:hover { border-color: var(--text-accent); transform: translateY(-1px); }
        .error-message { background: #fee; border: 1px solid #fcc; color: #c33; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
        .success-message { background: #efe; border: 1px solid #cfc; color: #363; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: var(--text-accent); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <svg width="50" height="50" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="#0F7B0F"/><text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="16">GFG</text></svg>
                <h1 class="auth-title">Welcome</h1>
                <p class="auth-subtitle">Sign in to track your learning progress</p>
            </div>
            <div class="auth-body">
                <div id="errorMsg" class="error-message"></div>
                <div id="successMsg" class="success-message"></div>
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Login</button>
                    <button class="auth-tab" data-tab="signup">Sign Up</button>
                </div>
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="loginEmail" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="loginPassword" required placeholder="Your password" minlength="6">
                    </div>
                    <button type="submit" class="form-button" id="loginBtn">Login</button>
                </form>
                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Display Name</label>
                        <input type="text" class="form-input" id="signupName" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="signupEmail" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="signupPassword" required placeholder="Min 6 characters" minlength="6">
                    </div>
                    <button type="submit" class="form-button" id="signupBtn">Create Account</button>
                </form>
                <div class="auth-divider"><span>or</span></div>
                <button class="google-btn" id="googleBtn">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
                <div class="back-link"><a href="index.html">← Back to Home</a></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, isFirebaseConfigured } from '../database/firebase-config.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { createUserProfile } from '../api/firebase-client.js';

        if (isFirebaseConfigured()) {
            onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'dashboard.html'; });
        }

        const showError = (msg) => { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('successMsg').style.display = 'none'; };
        const showSuccess = (msg) => { const el = document.getElementById('successMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('errorMsg').style.display = 'none'; };

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab === 'login' ? 'loginForm' : 'signupForm').classList.add('active');
                document.getElementById('errorMsg').style.display = 'none';
                document.getElementById('successMsg').style.display = 'none';
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isFirebaseConfigured()) { showError('Firebase not configured. See database/firebase-config.js'); return; }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Logging in...';
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                window.location.href = 'dashboard.html';
            } catch (err) {
                showError(err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.message);
                btn.disabled = false; btn.textContent = 'Login';
            }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isFirebaseConfigured()) { showError('Firebase not configured. See database/firebase-config.js'); return; }
            const btn = document.getElementById('signupBtn');
            btn.disabled = true; btn.textContent = 'Creating account...';
            try {
                const name = document.getElementById('signupName').value;
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value);
                await updateProfile(cred.user, { displayName: name });
                await createUserProfile(cred.user.uid, { displayName: name, email: cred.user.email });
                window.location.href = 'dashboard.html';
            } catch (err) {
                showError(err.code === 'auth/email-already-in-use' ? 'Account already exists with this email.' : err.message);
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            if (!isFirebaseConfigured()) { showError('Firebase not configured. See database/firebase-config.js'); return; }
            try {
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                await createUserProfile(result.user.uid, { displayName: result.user.displayName, email: result.user.email, avatar: result.user.photoURL });
                window.location.href = 'dashboard.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') showError(err.message);
            }
        });
    </script>
</body>
</html>
