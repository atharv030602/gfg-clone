<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#E8F5E8"/>
  
  <!-- Laptop -->
  <rect x="150" y="150" width="300" height="180" rx="10" fill="#2F8D46"/>
  <rect x="160" y="160" width="280" height="140" fill="#1a1a1a"/>
  
  <!-- Code lines -->
  <rect x="180" y="180" width="100" height="8" rx="4" fill="#4CAF50"/>
  <rect x="290" y="180" width="60" height="8" rx="4" fill="#81C784"/>
  
  <rect x="180" y="200" width="80" height="8" rx="4" fill="#66BB6A"/>
  <rect x="270" y="200" width="80" height="8" rx="4" fill="#4CAF50"/>
  
  <rect x="180" y="220" width="120" height="8" rx="4" fill="#81C784"/>
  <rect x="310" y="220" width="40" height="8" rx="4" fill="#66BB6A"/>
  
  <rect x="180" y="240" width="90" height="8" rx="4" fill="#4CAF50"/>
