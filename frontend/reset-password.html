<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GFG Clone</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2f8d46 0%, #45a359 100%);
            padding: 1rem;
        }
        
        .reset-card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .reset-icon {
            font-size: 3rem;
            color: #2f8d46;
            margin-bottom: 1rem;
        }
        
        .reset-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .reset-subtitle {
            color: #666;
            margin-bottom: 0;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            border-color: #2f8d46;
            outline: none;
        }
        
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
        
        .strength-indicator {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 0.25rem 0;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            transition: width 0.3s, background-color 0.3s;
            width: 0;
            background: #e74c3c;
        }
        
        .strength-bar.weak { width: 25%; background: #e74c3c; }
        .strength-bar.fair { width: 50%; background: #f39c12; }
        .strength-bar.good { width: 75%; background: #f1c40f; }
        .strength-bar.strong { width: 100%; background: #2f8d46; }
        
        .reset-button {
            width: 100%;
            background: #2f8d46;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .reset-button:hover:not(:disabled) {
            background: #45a359;
        }
        
        .reset-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading-spinner {
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .success-message {
            background: #efe;
            color: #363;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-link a {
            color: #2f8d46;
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <div class="reset-icon">🔑</div>
                <h1 class="reset-title">Reset Your Password</h1>
                <p class="reset-subtitle">Enter your new password below</p>
            </div>
            
            <form id="resetForm">
                <div id="messageContainer"></div>
                
                <div class="form-group">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-input" 
                           placeholder="Enter your new password" required>
                    <div class="password-strength">
                        <div class="strength-indicator">
                            <div id="strengthBar" class="strength-bar"></div>
                        </div>
                        <div id="strengthText">Password strength: <span>Not entered</span></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" 
                           placeholder="Confirm your new password" required>
                </div>
                
                <button type="submit" id="resetButton" class="reset-button">
                    Reset Password
                </button>
            </form>
            
            <div class="back-link">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const resetForm = document.getElementById('resetForm');
            const resetButton = document.getElementById('resetButton');
            const messageContainer = document.getElementById('messageContainer');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (!token) {
                showMessage('Invalid or missing reset token. Please request a new password reset.', 'error');
                resetButton.disabled = true;
                return;
            }
            
            // Password strength checker
            newPasswordInput.addEventListener('input', function() {
                const password = this.value;
                const strength = checkPasswordStrength(password);
                updatePasswordStrength(strength);
            });
            
            // Form submission
            resetForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (newPassword !== confirmPassword) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }
                
                if (newPassword.length < 6) {
                    showMessage('Password must be at least 6 characters long.', 'error');
                    return;
                }
                
                await resetPassword(token, newPassword);
            });
            
            function checkPasswordStrength(password) {
                let score = 0;
                
                if (password.length >= 6) score++;
                if (password.length >= 8) score++;
                if (/[a-z]/.test(password)) score++;
                if (/[A-Z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^a-zA-Z0-9]/.test(password)) score++;
                
                if (score < 3) return { level: 'weak', text: 'Weak' };
                if (score < 4) return { level: 'fair', text: 'Fair' };
                if (score < 6) return { level: 'good', text: 'Good' };
                return { level: 'strong', text: 'Strong' };
            }
            
            function updatePasswordStrength(strength) {
                strengthBar.className = `strength-bar ${strength.level}`;
                strengthText.innerHTML = `Password strength: <span>${strength.text}</span>`;
            }
            
            async function resetPassword(token, newPassword) {
                resetButton.disabled = true;
                resetButton.innerHTML = '<span class="loading-spinner"></span>Resetting...';
                
                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, newPassword })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showMessage('Password reset successful! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    } else {
                        showMessage(data.error || 'Password reset failed. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    resetButton.disabled = false;
                    resetButton.innerHTML = 'Reset Password';
                }
            }
            
            function showMessage(message, type) {
                messageContainer.innerHTML = `
                    <div class="${type}-message">
                        ${message}
                    </div>
                `;
            }
        });
    </script>
    <script src="../script.js"></script>
    <script type="module" src="../components/chatbot-widget.js"></script>
    <script type="module" src="../components/auth-guard.js"></script>
</body>
</html>
