<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Assistant - GFG Clone</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* AI Chatbot Styles */
        .ai-chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .chat-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2F8D46, #0F7B0F);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(47, 141, 70, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(47, 141, 70, 0.6);
        }

        .chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        .chat-container.open {
            display: flex;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .chat-header {
            background: linear-gradient(135deg, #2F8D46, #0F7B0F);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .status-indicator {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .chat-message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-bubble.user {
            background: linear-gradient(135deg, #2F8D46, #0F7B0F);
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message-bubble.ai {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-bubble pre {
            background: #f5f5f5;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .message-bubble code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            max-width: fit-content;
            border: 1px solid #e0e0e0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #2F8D46;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .suggestion-btn {
            background: #E8F5E8;
            color: #2F8D46;
            border: 1px solid #2F8D46;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            background: #2F8D46;
            color: white;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: #2F8D46;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2F8D46, #0F7B0F);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-message h4 {
            color: #2F8D46;
            margin-bottom: 10px;
        }

        .welcome-message p {
            color: #666;
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-action-btn {
            background: white;
            border: 2px solid #2F8D46;
            color: #2F8D46;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .quick-action-btn:hover {
            background: #2F8D46;
            color: white;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .chat-container {
                width: calc(100vw - 40px);
                height: calc(100vh - 100px);
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Include your navbar here -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" class="logo-svg">
                    <rect width="40" height="40" rx="8" fill="#0F7B0F"/>
                    <text x="20" y="28" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="16">GFG</text>
                </svg>
                <span class="logo-text">GeeksforGeeks</span>
            </div>
            <nav class="nav-menu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="practice.html">Practice</a></li>
                    <li><a href="ai-chatbot.html" class="active">AI Assistant</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- AI Chat Widget -->
    <div class="ai-chat-widget">
        <button class="chat-toggle-btn" id="chatToggle" onclick="toggleChat()">
            🤖
        </button>

        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <h3>
                    <span class="status-indicator"></span>
                    AI Coding Assistant
                </h3>
                <button class="chat-close-btn" onclick="toggleChat()">×</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h4>👋 Hello! I'm your AI Coding Assistant</h4>
                    <p>I can help you with programming concepts, data structures, algorithms, and interview preparation.</p>
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="sendQuickMessage('Explain binary search algorithm')">
                            📚 Explain binary search
                        </button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('What are the common data structures?')">
                            🗂️ Common data structures
                        </button>
                        <button class="quick-action-btn" onclick="sendQuickMessage('Tips for coding interviews')">
                            💼 Interview tips
                        </button>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Ask me anything about coding..."
                    onkeypress="handleKeyPress(event)"
                >
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script src="ai-chatbot.js"></script>
</body>
</html>
